<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="100%" height="100%">
  <defs>
    <linearGradient id="unetiGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="unetiGradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ISO / ICON -->
  <g transform="translate(10, 10)">
    <!-- Tech Rings (Telecom & Data) -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="url(#orbitGrad)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
    <circle cx="50" cy="50" r="37" fill="none" stroke="#38BDF8" stroke-width="1.5" opacity="0.4" />
    
    <!-- Central Hex Core -->
    <polygon points="50,18 78,34 78,66 50,82 22,66 22,34" fill="url(#unetiGradPrimary)" filter="url(#glow)"/>
    
    <!-- Inner Geometric Grid / Satellite / Network Node -->
    <polygon points="50,26 71,38 71,62 50,74 29,62 29,38" fill="#0F172A" opacity="0.85" />
    
    <!-- Signal waves & nodes -->
    <path d="M35 50 Q50 35 65 50" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" />
    <path d="M40 57 Q50 47 60 57" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" />
    
    <!-- Core pulse node -->
    <circle cx="50" cy="50" r="4.5" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="2" fill="#0284C7" />
    
    <!-- Satellites / Nodes -->
    <circle cx="50" cy="18" r="3" fill="#38BDF8" />
    <circle cx="78" cy="66" r="3" fill="#38BDF8" />
    <circle cx="22" cy="66" r="3" fill="#38BDF8" />
    <circle cx="85" cy="30" r="2.5" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- TEXT / TYPOGRAPHY -->
  <g transform="translate(130, 28)">
    <!-- Acronym -->
    <text x="0" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="42" fill="#FFFFFF" letter-spacing="3">
      UNE<tspan fill="#38BDF8">TI</tspan>
    </text>
    
    <!-- Subtitle 1 -->
    <text x="2" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="11" fill="#94A3B8" letter-spacing="1.2">
      UNIVERSIDAD NACIONAL EXPERIMENTAL DE LAS TELECOMUNICACIONES E INFORMÁTICA
    </text>

    <!-- Subtitle 2: Materia / Trayecto -->
    <g transform="translate(2, 70)">
      <rect x="0" y="0" width="220" height="15" rx="3" fill="#1E293B" stroke="#334155" stroke-width="0.8"/>
      <text x="8" y="11" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#38BDF8" letter-spacing="0.8">
        PROYECTO SOCIO TECNOLÓGICO
      </text>
    </g>
  </g>
</svg>
